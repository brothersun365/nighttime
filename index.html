let state={},filter='all';const $=s=>document.querySelector(s);const dateEl=$('#date');const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};dateEl.value=localDate();const key=()=>`toyu_front_v1_${dateEl.value}`;const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{state=JSON.parse(localStorage.getItem(key()))||{}}catch{state={}};for(const n of ['weather','nineName','twoName']){$('#'+n).value=state[n]||''}render()}function save(){for(const n of ['weather','nineName','twoName'])state[n]=$('#'+n).value;try{localStorage.setItem(key(),JSON.stringify(state));$('#saveStatus').textContent='✓ 자동 저장됨'}catch{$('#saveStatus').textContent='저장 불가: 저장 공간 또는 브라우저 설정 확인'}progress()};function complete(t){return !!state['c_'+t.id]};function visible(t){if(filter==='periodic')return t.kind==='periodic';if(t.kind==='periodic')return false;if(filter==='pending')return !complete(t);if(filter==='9출')return t.owner==='9출'||t.owner==='공통';if(filter==='14출')return t.owner==='14출'||t.owner==='공통';if(filter==='마감')return ['마감','공통'].includes(t.owner);return true};function progress(){let active=TASKS.filter(visible);let done=active.filter(complete).length;let per=active.length?Math.round(done/active.length*100):0;$('#bar').style.width=per+'%';$('#progress').textContent=`${done} / ${active.length} 완료 · ${per}%`};function render(){
 const items=TASKS.filter(visible);
 const times=[...new Set(items.map(t=>t.time))];
 $('#jump').innerHTML=times.map((time,i)=>`<button data-jump="s${i}">${escapeHTML(time)}</button>`).join('');
 let out='';
 for(let i=0;i<times.length;i++){
   const time=times[i], group=items.filter(t=>t.time===time), num=group.filter(complete).length;
   out+=`<section class="step" id="s${i}"><div class="time"><div class="clock">${escapeHTML(time)}</div><small>${group.length}개 업무</small></div><div class="panel"><div class="panelhead"><strong>${time.startsWith('정기')?'🔁 정기 점검':'🍃 하나씩 완료하기'}</strong><span class="count">${num}/${group.length} 완료</span></div>`;
   for(const t of group){
     const checked=complete(t);
     out+=`<div class="task ${checked?'done':''}"><input class="check" aria-label="완료 ${escapeHTML(t.title)}" type="checkbox" data-id="${t.id}" ${checked?'checked':''}><div><div class="tasktitle">${escapeHTML(t.title)}</div>${t.desc?`<div class="desc">${escapeHTML(t.desc)}</div>`:''}<div class="taskmeta"><input type="text" placeholder="처리자" data-meta="person" data-id="${t.id}" value="${escapeHTML(state['p_'+t.id]||'')}"><input type="time" aria-label="처리시간" data-meta="time" data-id="${t.id}" value="${escapeHTML(state['time_'+t.id]||'')}"><button class="note-trigger" data-note="${t.id}">✎ 메모</button></div><textarea class="tasknote ${state['note_'+t.id]?'show':''}" data-meta="note" data-id="${t.id}" placeholder="특이사항 / 미완료 사유">${escapeHTML(state['note_'+t.id]||'')}</textarea></div><span class="tag ${t.owner==='9출'?'nine':t.owner==='14출'?'two':t.kind==='periodic'?'alert':''}">${escapeHTML(t.owner)}</span></div>`;
   }
   out+='</div></section>';
   if(time==='14:00~'&&filter==='all')out+=`<aside class="special"><h2>⚠️ 인스펙 시 객실별 특별 주의사항</h2><div class="warninggrid">${special.map(s=>`<div class="warn"><b>${s[0]}</b><p>${s[1]}</p></div>`).join('')}</div></aside>`;
   if(time==='17:00~'&&filter==='all')out+=`<aside class="special"><h2>🚿 물청소 주의</h2><div class="warn"><b>청소건 밸브 꼭 잠그기!</b><p>열어두면 바닥에 물이 샐 수 있어요. 청소 종료 후 다시 확인해주세요.</p></div></aside>`;
 }
 if(filter==='periodic')out+=`<div class="footnotes"><h3>📌 정기 점검 요일은 최종 확인이 필요해요</h3><p>기존 문서 간 린넨 삶기(목 / 금 / 화·목·일), 주전자 세척(수 / 일), 월간 설비 청소(월 1회 / 10·20·30일) 기준이 달랐습니다. 현장 확정 전까지 임의로 특정 요일에만 표시하지 않았습니다.</p></div>`;

}
$('#content').addEventListener('change',e=>{let el=e.target;if(el.matches('.check')){state['c_'+el.dataset.id]=el.checked;if(el.checked&&!state['time_'+el.dataset.id]){const d=new Date();state['time_'+el.dataset.id]=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}save();render()}else if(el.dataset.meta){let prefix=el.dataset.meta==='person'?'p_':el.dataset.meta==='time'?'time_':'note_';state[prefix+el.dataset.id]=el.value;save()}});$('#content').addEventListener('input',e=>{let el=e.target;if(el.dataset.meta){let prefix=el.dataset.meta==='person'?'p_':el.dataset.meta==='time'?'time_':'note_';state[prefix+el.dataset.id]=el.value;save()}});$('#content').addEventListener('click',e=>{let b=e.target.closest('[data-note]');if(b){let ta=b.closest('.task').querySelector('.tasknote');ta.classList.toggle('show');if(ta.classList.contains('show'))ta.focus()}});$('#jump').addEventListener('click',e=>{let b=e.target.closest('[data-jump]');if(b)document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'})});$('#filters').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});dateEl.addEventListener('change',load);for(const n of ['weather','nineName','twoName'])$('#'+n).addEventListener('input',save);
function download(name,contents,mime){const blob=new Blob([contents],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}$('#csv').onclick=()=>{let rows=[['날짜','날씨','시간','담당','업무','상세내용','완료','처리자','처리시간','메모','구분'],...TASKS.map(t=>[dateEl.value,state.weather||'',t.time,t.owner,t.title,t.desc,complete(t)?'완료':'미완료',state['p_'+t.id]||'',state['time_'+t.id]||'',state['note_'+t.id]||'',t.kind])];download(`TOYU_프런트업무_${dateEl.value}.csv`,'\ufeff'+rows.map(a=>a.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV 파일을 저장했어요')};$('#json').onclick=()=>{download(`TOYU_프런트업무_${dateEl.value}.json`,JSON.stringify({date:dateEl.value,...state,tasks:TASKS},null,2),'application/json');toast('백업 파일을 저장했어요')};$('#print').onclick=()=>window.print();$('#reset').onclick=()=>{if(!confirm(`${dateEl.value}의 모든 체크·처리자·시간·메모를 초기화할까요?`))return;state={};save();load();toast('이 날짜 기록을 초기화했어요')};$('#copyReport').onclick=async()=>{const all=TASKS.filter(t=>t.kind==='daily'),completed=all.filter(complete),pending=all.filter(t=>!complete(t));let lines=[`[TOYU 프런트팀 업무 현황]`,`${dateEl.value} / 날씨: ${state.weather||'미입력'}`,`9시 출근: ${state.nineName||'-'} / 14시 출근: ${state.twoName||'-'}`,`완료 ${completed.length}/${all.length}건`, '', '■ 완료 업무',...completed.map(t=>`✓ ${t.time} ${t.title}${state['p_'+t.id]?' ('+state['p_'+t.id]+')':''}`),'','■ 미완료 업무',...pending.map(t=>`□ ${t.time} ${t.title}${state['note_'+t.id]?' / '+state['note_'+t.id]:''}`)];let output=lines.join('\n');try{await navigator.clipboard.writeText(output);toast('카톡용 업무 현황을 복사했어요')}catch{const ta=document.createElement('textarea');ta.value=output;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('보고 내용을 복사했어요')}};let tm;function toast(s){let t=$('#toast');t.textContent </script></body></html>
